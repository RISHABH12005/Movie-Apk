name: Build Movie Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Movie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Movie APK v1.1
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish Movie APK v1.1')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          name: Movie Android App v1.1
          body: |
            Keeps Bollyflix navigation inside the Android app.
            Adds selectable domain candidates, remembers the last selected domain, and provides a retry state for unavailable domains.
            Domain availability and authenticity cannot be guaranteed by the app.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
